version: 2.1

executors:
  node:
    parameters:
      node-version:
        type: string
        default: '22.23'
    docker:
      - image: cimg/node:<< parameters.node-version >>
        auth:
          username: $DOCKERHUB_USERNAME
          password: $DOCKERHUB_PASSWORD

jobs:
  check:
    executor: node
    steps:
      - checkout
      - run:
          name: NPM install
          command: npm ci
      - run:
          name: Check types, lint and formatting
          command: npm run check
  test:
    parameters:
      node-version:
        type: string
    executor:
      name: node
      node-version: << parameters.node-version >>
    steps:
      - checkout
      - run:
          name: NPM install
          command: npm ci
      - run:
          name: Run tests with coverage
          command: npm run test:ci
  publish-npm:
    executor: node
    steps:
      - checkout
      - run:
          name: NPM install
          command: npm ci
      - run:
          name: Authenticate with NPM
          command: npm config set '//registry.npmjs.org/:_authToken' "${NPM_TOKEN}"
      - run:
          name: Publish package
          command: |
            # Publish as beta for pre-release tags like v1.2.3-pre.1
            [[ $CIRCLE_TAG =~ ^v.*- ]] && NPM_TAG=--tag=beta
            npm publish $NPM_TAG

workflows:
  test-and-publish:
    jobs:
      - check:
          context:
            - particle-ci-private
          # run for all branches and tags
          filters:
            tags:
              only: /^v.*/
            branches:
              only: /.*/
      - test:
          context:
            - particle-ci-private
          matrix:
            parameters:
              node-version: ['22.23', '26.13']
          # run for all branches and tags
          filters:
            tags:
              only: /^v.*/
            branches:
              only: /.*/
      - publish-npm:
          requires:
            - check
            - test
          context:
            - particle-ci-private
          # publish for tags only
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
